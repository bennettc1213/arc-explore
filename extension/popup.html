<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>

      <span class="mark">arc</span>

    <main id="root">

    </footer>

    <script src="popup.js" type="module"></script>
