####
# WHY `npm install` AND NOT `npm ci` IN THIS FILE.
#
# `npm ci` fails here, and it is not a stale lockfile. `package-lock.json` is
# generated on Windows, where npm installs the native `win32` binding for
# Tailwind's oxide and for sharp and therefore never materialises the
# `wasm32-wasi` subtrees. Those optional packages ARE listed in the lock, and
# they declare `@emnapi/core ^1.11.1` / `@emnapi/runtime ^1.11.1` — but the only
# @emnapi entries the lock actually carries are 1.10.0, nested under a different
# package. On Linux `npm ci` validates the whole tree, finds the hole, and
# refuses:  `Missing: @emnapi/runtime@1.11.3 from lock file`.
#
# No amount of regenerating the lock on Windows fixes that; Windows npm will
# never expand a subtree it does not need. `npm install` resolves the missing
# entries instead of asserting the lock is complete, which is why it works.
#
# THE COST, STATED: we lose `npm ci`'s guarantee that CI installs byte-identical
# dependencies to the lock. That is acceptable *for these workflows specifically*
# because none of them builds the app or runs the test suite — every one runs a
# `tsx` script that needs dotenv, drizzle and postgres. It would not be
# acceptable for a build or a release job.
#
# TO RESTORE `npm ci`: regenerate the lockfile once on Linux (any x64 box, WSL,
# or a container) and commit it. Recorded in FIXES.md.
####
####
# Tier B — daily registry discovery.
#
# Reads the Simplify repo for COMPANY NAMES ONLY and enrolls them, so Tier A
# can poll their real boards. No listing content is stored: the repo carries no
# license, and its listings measured 50% stale beyond 30 days. Taking the names
# (facts) and pulling postings from each employer's own ATS is both the clean
# path and the better data.
####
name: ingest-daily

on:
  schedule:
    - cron: "17 7 * * *" # 07:17 UTC — off the hour, where scheduler load is lower
  workflow_dispatch:
    inputs:
      maxNew:
        description: "ceiling on new companies enrolled this run"
        required: false
        default: "400"

concurrency:
  group: ingest-daily
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # `npm install`, NOT `npm ci` — see the note at the top of this file.
      - run: npm install --no-audit --no-fund

      - name: discover companies
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run ingest:daily -- --max-new ${{ github.event.inputs.maxNew || '400' }}

      # Federal student openings. Daily rather than on the 20-minute loop:
      # announcements carry an explicit closing date and do not churn the way a
      # startup's board does, and one API call for the whole government is not
      # something to make 72 times a day. That cadence is why these rows are
      # written as `periodic_check` — they render "checked as of <date>", not
      # "confirmed live". Moving this step to ingest-fast is what would earn
      # the stronger claim.
      #
      # `if: always()` so a USAJobs outage cannot mask the discovery result
      # above it, and vice versa — they share nothing but a schedule.
      - name: ingest usajobs
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_USER_AGENT: ${{ secrets.USAJOBS_USER_AGENT }}
        run: npm run ingest:usajobs
